<!DOCTYPE html>
<html lang=es>

<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.com/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org"></script>
</head>

<body>
  <form hx-post="/demo/validate" hx-target="#result" hx-swap="innerHTML">
    <label for="country">Pais</label>
    <input type="text" id="country" name="country" />
    <label for="docType">Tipo Documento</label>
    <input type="text" id="docType" name="docType" />
    <label for="value">Número</label>
    <input type="text" id="value" name="value" />
    <button type="submit">Validar</button>
  </form>

  <div id="result">
  </div>
</body>

</html>
